<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VeriExam — Instructor Dashboard</title>
    <style>
      /* Exam/proctor alert animations (used by ProctorBanner + StudentGrid). */
      @keyframes proctor-pulse {
        0%   { box-shadow: 0 0 0 0 rgba(185, 28, 28, 0.55); }
        70%  { box-shadow: 0 0 0 10px rgba(185, 28, 28, 0); }
        100% { box-shadow: 0 0 0 0 rgba(185, 28, 28, 0); }
      }
      .proctor-pulse { animation: proctor-pulse 1.4s ease-out infinite; }
      @keyframes proctor-flash {
        0%, 100% { opacity: 1; }
        50%      { opacity: 0.55; }
      }
      .proctor-flash { animation: proctor-flash 1s ease-in-out infinite; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
