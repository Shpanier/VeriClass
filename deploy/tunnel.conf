# ─────────────────────────────────────────────────────────────────────────
#  Tunnel configuration for deploy/tunnel.sh
#  Edit these, then run:  bash deploy/tunnel.sh
# ─────────────────────────────────────────────────────────────────────────

# Which tunnel to expose the backend through:
#   ngrok            ngrok with your free static domain   (set NGROK_DOMAIN)
#   cloudflare       Cloudflare NAMED tunnel, stable URL   (needs a domain; set CF_TUNNEL_NAME)
#   cloudflare-quick Cloudflare quick tunnel, RANDOM url   (no account/domain; URL changes each run)
PROVIDER=ngrok

# The local port your FastAPI backend listens on (dev_up.sh uses 8010).
BACKEND_PORT=8010

# ── ngrok ────────────────────────────────────────────────────────────────
# Your free permanent domain from https://dashboard.ngrok.com → Domains.
# Example: chip-calm-mallard.ngrok-free.app   (NO https://, just the host)
NGROK_DOMAIN=upgrade-nape-smasher.ngrok-free.dev


# ── cloudflare (named tunnel) ──────────────────────────────────────────────
# The tunnel name you created with `cloudflared tunnel create <name>` and
# routed to a hostname with `cloudflared tunnel route dns <name> <hostname>`.
CF_TUNNEL_NAME=veriexam-exam
