exercise_id: ex5-pycalc
title_he: "pycalc — מחשבון אריתמטי מובנה (Python)"
title_en: "pycalc — Built-in Arithmetic Calculator (Python)"
default_mode: mentor

# Python cohorts get a .py starter (see ExerciseScaffolder). The plugin picks the
# language from this filename's extension, and the grader runs it with python3.
scaffold_filename: pycalc.py

brief_md: |
  In this exercise you will build a built-in command called `pycalc`
  in **Python**. Like a mini-shell built-in, it reads a single command
  line from **standard input** of the form:

      pycalc "3 + 4 * 2"

  It parses the arithmetic expression, computes the result, and prints
  the **integer result on its own line** (the last line of output is what
  is graded):

      pycalc "3 + 4 * 2"
      11

  Read the whole line from `stdin`, take the text between the quotes as
  the expression, and print the answer. Your `pycalc` must respect
  operator precedence (`*`, `/`, `%` before `+` and `-`) and the specific
  parameters of your assigned variant (@operators, @allow_parens,
  @max_number). Using an operator that is not allowed, or parentheses when
  they are not allowed, is an invalid expression. Errors must use the exact
  format under `required_error_strings` — the grader checks bytes, not meaning.

variants:
  - id: V-P1
    params:
      max_number: 100
      operators: ["+", "-", "*", "/"]
      allow_parens: false
    test_inputs:
      - { input: "2 + 3", expected_output: "5" }
      - { input: "50 * 3", expected_output: "Error: result out of range" }
      - { input: "10 / 0", expected_output: "Error: division by zero" }

  - id: V-P2
    params:
      max_number: 1000
      operators: ["+", "-", "*", "/", "%"]
      allow_parens: true
    test_inputs:
      - { input: "(3 + 4) * 2", expected_output: "14" }
      - { input: "999 * 999", expected_output: "Error: result out of range" }
      - { input: "17 % 5", expected_output: "2" }

  - id: V-P3
    params:
      max_number: 500
      operators: ["+", "-", "*", "/"]
      allow_parens: true
    test_inputs:
      - { input: "(10 - 2) * 5", expected_output: "40" }
      - { input: "501 + 0", expected_output: "Error: result out of range" }
      - { input: "20 / 0", expected_output: "Error: division by zero" }

  - id: V-P4
    params:
      max_number: 2000
      operators: ["+", "-", "*"]
      allow_parens: false
    test_inputs:
      - { input: "100 * 20", expected_output: "2000" }
      - { input: "100 * 21", expected_output: "Error: result out of range" }
      - { input: "7 / 1", expected_output: "Error: invalid expression" }

  - id: V-P5
    params:
      max_number: 100
      operators: ["+", "-", "*", "/", "%"]
      allow_parens: false
    test_inputs:
      - { input: "97 % 13", expected_output: "6" }
      - { input: "50 + 51", expected_output: "Error: result out of range" }
      - { input: "9 / 0", expected_output: "Error: division by zero" }

  - id: V-P6
    params:
      max_number: 255
      operators: ["+", "-", "*", "/", "%"]
      allow_parens: true
    test_inputs:
      - { input: "(200 + 55)", expected_output: "255" }
      - { input: "200 + 56", expected_output: "Error: result out of range" }
      - { input: "255 % 7", expected_output: "3" }

# Human-readable labels for the per-variant `params` keys above. Rendered as a
# labeled list in the student briefing and the teacher dashboard. Optional — keys
# without a label fall back to a prettified version of the key.
param_labels:
  - key: max_number
    label: "Maximum result"
    note: "results above this (or below 0) must print 'Error: result out of range'"
  - key: operators
    label: "Allowed operators"
  - key: allow_parens
    label: "Parentheses allowed"

welcome_suggestions:
  - "How do I read a line from stdin and pull out the quoted expression in Python?"
  - "Explain recursive descent vs. the Shunting-yard algorithm for precedence"
  - "Give me a skeleton that reads stdin and prints the result on its own line"

required_error_strings:
  - "Error: division by zero\n"
  - "Error: result out of range\n"
  - "Error: invalid expression\n"
