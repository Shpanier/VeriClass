# Tests, and checks that VeriClass installs and works, on Linux, macOS and Windows,
# each on Intel/AMD and on ARM.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  server:
    name: Tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, macos-15-intel, windows-latest, windows-11-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Windows on ARM runs the x64 Python (as start.bat does)
        if: matrix.os == 'windows-11-arm'
        run: echo "UV_PYTHON=cpython-3.12-windows-x86_64-none" >> "$GITHUB_ENV"
      - name: Install (as the start scripts do)
        run: uv sync --frozen
      - name: Tests
        run: |
          set +e
          uv run --frozen pytest -q -rfE --tb=short > pytest.log 2>&1
          status=$?
          cat pytest.log
          # Each failing test as an annotation, so it shows on the run's summary page.
          grep -E '^(FAILED|ERROR) ' pytest.log | head -30 | sed 's/^/::error title=Test::/'
          exit $status
      - name: Starts, and a lecturer and a student can use it
        env:
          VERICLASS_ENV_FILE: ${{ runner.temp }}/ci.env
          DB_PATH: ${{ runner.temp }}/ci.db
          VERICLASS_DATA_DIR: ${{ runner.temp }}/ci-data
        run: |
          # The environment's own Python, not `uv run`: a uv process left running
          # holds uv's cache lock, and the setup-uv cleanup step then fails.
          py=.venv/bin/python; [ -f .venv/Scripts/python.exe ] && py=.venv/Scripts/python.exe
          "$py" -c "import platform, sys; print(sys.version, platform.machine())"
          "$py" -m backend.cli --port 8099 --no-browser > server.log 2>&1 &
          server=$!
          set +e
          "$py" .github/smoke.py http://127.0.0.1:8099 . 180
          status=$?
          kill $server
          [ $status -ne 0 ] && cat server.log
          exit $status

  install:
    # What a new lecturer does: the install line from the README, on a computer
    # without uv, into a folder whose name has a space and Hebrew letters; then
    # the smoke test against the server it started.
    name: Install (${{ matrix.os }})
    if: github.event_name != 'pull_request' && github.ref_type == 'branch'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, macos-15-intel, windows-latest, windows-11-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      VERICLASS_REPO: https://github.com/${{ github.repository }}
      VERICLASS_BRANCH: ${{ github.ref_name }}
      SCRIPTS: https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: checkout
      - name: The install line (macOS, Linux)
        if: runner.os != 'Windows'
        shell: bash
        env:
          VERICLASS_DIR: ${{ runner.temp }}/Veri Class שיעור
        run: |
          command -v uv && echo "(uv was already installed here)" || echo "(no uv: start.sh installs it)"
          curl -fsSL "$SCRIPTS/install.sh" | bash -s -- --no-browser > install.log 2>&1 &
          for i in $(seq 1 300); do
            curl -sf -o /dev/null http://127.0.0.1:8010/healthz && break
            sleep 3
          done
          cat install.log
          py="$VERICLASS_DIR/.venv/bin/python"
          "$py" -c "import platform, sys; print(sys.version, platform.machine())"
          set +e
          "$py" checkout/.github/smoke.py http://127.0.0.1:8010 "$VERICLASS_DIR" 30
          status=$?
          pkill -f "backend.cli" || true
          exit $status
      - name: The install line (Windows PowerShell)
        if: runner.os == 'Windows'
        shell: powershell
        env:
          VERICLASS_DIR: ${{ runner.temp }}\Veri Class שיעור
        run: |
          $ErrorActionPreference = "Continue"
          if (Get-Command uv -ErrorAction SilentlyContinue) { "(uv was already installed here)" } else { "(no uv: start.bat installs it)" }
          # Exactly the README's line, in a PowerShell window of its own, left running as a lecturer would.
          $win = Start-Process powershell -ArgumentList "-NoProfile", "-Command", "irm '$env:SCRIPTS/install.ps1' | iex" -PassThru
          $deadline = (Get-Date).AddMinutes(15)
          $up = $false
          while ((Get-Date) -lt $deadline -and -not $win.HasExited) {
            try { $up = (Invoke-WebRequest http://127.0.0.1:8010/healthz -UseBasicParsing -TimeoutSec 5).StatusCode -eq 200 } catch { }
            if ($up) { break }
            Start-Sleep 3
          }
          if (-not $up) {
            "::error title=Install::The server didn't start (the installer's window exited: $($win.HasExited))."
            Get-ChildItem $env:VERICLASS_DIR -Force -ErrorAction SilentlyContinue | ForEach-Object { $_.Name }
            exit 1
          }
          $py = Join-Path $env:VERICLASS_DIR ".venv\Scripts\python.exe"
          & $py -c "import platform, sys; print(sys.version, platform.machine())"
          & $py checkout\.github\smoke.py http://127.0.0.1:8010 "$env:VERICLASS_DIR" 30
          $status = $LASTEXITCODE
          Get-Process python, uv -ErrorAction SilentlyContinue | Stop-Process -Force
          Stop-Process -Id $win.Id -Force -ErrorAction SilentlyContinue
          exit $status
      - name: If it failed, what start.bat says
        if: failure() && runner.os == 'Windows'
        timeout-minutes: 6
        shell: cmd
        env:
          VERICLASS_DIR: ${{ runner.temp }}\Veri Class שיעור
        run: call "%VERICLASS_DIR%\start.bat" --no-browser --port 8012 < NUL

  dashboard:
    name: Dashboard
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
      - name: Type-check and build
        run: npm run build
