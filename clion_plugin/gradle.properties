# --- OS Lab CLion plugin build configuration ---
# CLion build to compile/run against. 2024.2.x ships on JBR 21.
# Find versions: https://www.jetbrains.com/intellij-repository/releases
pluginGroup=edu.jce.oslab
pluginVersion=0.1.0

# CLion target. Override on the command line, e.g.:
#   ./gradlew runIde -PclionVersion=2024.3.5
clionVersion=2024.2.5

# Plugin compatibility range (build numbers, not product versions).
pluginSinceBuild=242
pluginUntilBuild=251.*

org.gradle.jvmargs=-Xmx2g -XX:+UseParallelGC
org.gradle.caching=true
org.gradle.configuration-cache=false
kotlin.stdlib.default.dependency=false
