# The students' chat (student_app/app.py, Chainlit 2.x). Served by the VeriClass
# server at /chat, or on its own with: chainlit run student_app/app.py

[project]
user_env = []
# How long a student's chat is kept when the connection drops (seconds).
session_timeout = 3600
# How long a sign-in lasts (seconds): 15 days.
user_session_timeout = 1296000
cache = false
allow_origins = ["*"]

[features]
unsafe_allow_html = false
latex = false
user_message_markdown = true
user_message_autoscroll = true
assistant_message_autoscroll = true
edit_message = false
allow_thread_sharing = false
favorites = false

[features.spontaneous_file_upload]
    enabled = false

[features.audio]
    enabled = false

[features.mcp]
    enabled = false

[UI]
name = "VeriClass"
description = "Your lab's tutor and steps"
default_theme = "dark"
default_sidebar_state = "hidden"
confirm_new_chat = true
cot = "hidden"
alert_style = "modern"
custom_css = "/public/vericlass-chat.css"
custom_js = "/public/vericlass-chat.js"
login_page_image = "/public/login.svg"
# Show the picture as it is (Chainlit greys out its own default picture).
login_page_image_filter = "brightness-100"
login_page_image_dark_filter = "brightness-100"

[meta]
generated_by = "2.11.1"
