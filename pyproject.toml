[project]
name = "vericlass"
version = "1.0.0"
description = "A lecturer-controlled AI tutor for programming classes: the lecturer's dashboard and the students' chat."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi==0.138.1",
    "uvicorn[standard]==0.49.0",
    "pydantic>=2.10,<3",
    "python-dotenv==1.0.1",
    "PyYAML==6.0.2",
    # Round-trip YAML: dashboard edits written back into exercise packages keep their comments.
    "ruamel.yaml>=0.18",
    "httpx>=0.28,<1",
    # The students' chat.
    "chainlit==2.11.1",
    # The agents that draft answers for the lecturer, suggest questions and grade.
    "crewai==0.130.0",
    "litellm==1.72.0",
    # crewai's telemetry imports pkg_resources, which setuptools 81+ dropped.
    "setuptools<81",
]

[dependency-groups]
dev = ["pytest==8.3.3", "ruff==0.7.0"]

[tool.uv]
# An application run from its folder (start.sh / start.bat), not an installable package.
package = false
# Every other package at the version the reference installation runs in class, so a new
# install gets the tested set, not whatever was released since (uv lock --upgrade to move on).
constraint-dependencies = [
