# --- VeriExam plugin build configuration (shared by :clion and :pycharm) ---
# Both modules compile the same core/ sources; each targets its own IDE.
# 2024.2.x of both products ships on JBR 21 (build number 242).
# Find versions: https://www.jetbrains.com/intellij-repository/releases
pluginGroup=edu.jce.veriexam
# Single shared version across both plugins.
pluginVersion=0.4.1

# CLion target (:clion module). Override on the command line, e.g.:
#   ./gradlew :clion:runIde -PclionVersion=2024.3.5
clionVersion=2024.2.5

# PyCharm Community target (:pycharm module). Override with -PpycharmVersion=…
# Kept at the OLDEST version we support on purpose: a plugin compiled against
# 2024.2 is forward-compatible and loads on every later build (2025.1, 2025.2,
# 2026.1 = build 261, …) — one artifact spans the whole range. To develop/verify
# against your exact IDE, override per-invocation instead of editing this:
#   ./gradlew :pycharm:runIde -PpycharmVersion=2026.1.3
pycharmVersion=2024.2.5

# Compatibility range for BOTH plugins (build numbers, not product versions):
# 242 = 2024.2 … open-ended upper bound (see build.gradle.kts untilBuild=null),
# so the built zip already declares itself compatible with 2025.x and 2026.x.

# Plugin compatibility range (build numbers, not product versions).
pluginSinceBuild=242
pluginUntilBuild=251.*

org.gradle.jvmargs=-Xmx2g -XX:+UseParallelGC
org.gradle.caching=true
org.gradle.configuration-cache=false
kotlin.stdlib.default.dependency=false
