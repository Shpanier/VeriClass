# OS Lab exam configuration.
# The installers (install-macos.command / install-windows.bat) read this file.
# Edit BACKEND_URL to the address students should reach during the exam, then
# re-zip the folder and hand it out. (The make_exam_package.sh script can stamp
# this for you with --backend-url.)

# Where the FastAPI backend runs. On a classroom LAN use the teacher machine's
# IP, e.g. http://10.0.0.5:8000 — NOT 127.0.0.1, which only works on the
# teacher's own computer.
BACKEND_URL=__BACKEND_URL__

# Which JetBrains IDE this package targets: CLion or PyCharm. The installers use
# it to find the right config folder and to quit/launch the right app.
# make_exam_package.sh stamps this from --product.
IDE_PRODUCT=__IDE_PRODUCT__

# Optional: a project folder to open in the IDE automatically. Leave blank to let
# each student open or create their own project.
PROJECT_DIR=

# Optional: preset a shared login code (skips the login prompt). Normally leave
# this BLANK so each student logs in with their own personal code.
DEV_LOGIN_CODE=
